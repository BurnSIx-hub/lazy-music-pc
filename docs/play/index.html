<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lazy Music</title>
<!--
  Переходник для кнопки в Discord и ссылок «Поделиться»: открыть трек в
  Lazy Music, если она стоит, иначе — на YouTube. Discord пускает в кнопку
  только обычные веб-ссылки, поэтому сначала сюда.

  ?v=<id ролика>&t=<название>&a=<исполнитель>

  Android (Chrome): intent-ссылка — система сама выбирает приложение или
  запасной адрес. ПК: пробуем lazymusic://; приложение открылось — окно
  браузера теряет фокус; нет — через пару секунд уходим на YouTube.
  Ничего не отправляется и не собирается: всё здесь, в браузере.
-->
<style>
  :root { color-scheme: dark; --bg: #121214; --panel: #1c1c20; --text: #ececf1; --muted: #9b9ba6; --accent: #ff4d55; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 380px; background: var(--panel); border-radius: 16px; padding: 22px; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 18px; }
  .logo svg { width: 22px; height: 22px; }
  img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: #2a2a30; }
  h1 { font-size: 18px; margin: 14px 0 2px; overflow-wrap: anywhere; }
  .artist { color: var(--muted); margin: 0 0 16px; overflow-wrap: anywhere; }
  .status { color: var(--muted); font-size: 14px; min-height: 1.45em; margin: 0 0 14px; }
  a.btn { display: block; padding: 11px 14px; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 8px; }
  a.primary { background: var(--accent); color: #fff; }
  a.ghost { background: #2a2a30; color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="5" height="12" rx="2" fill="#ff4d55"/><rect x="10" y="3" width="5" height="18" rx="2" fill="#e8343c"/><rect x="17" y="15" width="5" height="6" rx="2" fill="#ff4d55"/></svg>
    Lazy Music
  </div>
  <img id="cover" alt="">
  <h1 id="title"></h1>
  <p class="artist" id="artist"></p>
  <p class="status" id="status">Открываю в Lazy Music…</p>
  <a class="btn primary" id="app" href="#">Открыть в Lazy Music</a>
  <a class="btn ghost" id="yt" href="#">Открыть на YouTube</a>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const id = q.get('v') || '';
  const title = (q.get('t') || '').slice(0, 200);
  const artist = (q.get('a') || '').slice(0, 200);
  const $ = s => document.getElementById(s);

  // Не похоже на ролик YouTube — делать здесь нечего
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
    $('status').textContent = 'К сожалению, ссылка сломана.';
    $('app').hidden = $('yt').hidden = true;
    return;
  }

  const yt = 'https://www.youtube.com/watch?v=' + id;
  const tail = 'play/' + id + '?t=' + encodeURIComponent(title) + '&a=' + encodeURIComponent(artist);
  const app = 'lazymusic://' + tail;
  const ua = navigator.userAgent;
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua);

  $('cover').src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
  $('title').textContent = title || 'Трек на YouTube';
  $('artist').textContent = artist;
  $('yt').href = yt;
  document.title = (title ? title + ' — ' : '') + 'Lazy Music';

  // Android: Chrome сам откроет приложение, а нет его — запасной адрес
  const intent = 'intent://' + tail + '#Intent;scheme=lazymusic;package=com.lazymusic.app;S.browser_fallback_url=' +
    encodeURIComponent(yt) + ';end';
  $('app').href = android ? intent : app;

  // Lazy Music для iPhone нет — сразу на YouTube
  if (ios) { location.replace(yt); return; }

  // Помним в этом браузере, что приложение уже открывалось: тогда ждём
  // дольше — человек мог задержаться на вопросе «Открыть Lazy Music?»
  let known = false;
  try { known = localStorage.getItem('lazymusic-app') === '1'; } catch (e) {}

  let opened = false;
  const done = () => {
    if (opened) return;
    opened = true;
    clearTimeout(timer);
    try { localStorage.setItem('lazymusic-app', '1'); } catch (e) {}
    $('status').textContent = 'Открыто в Lazy Music.';
  };
  window.addEventListener('blur', done);
  document.addEventListener('visibilitychange', () => { if (document.hidden) done(); });

  const timer = setTimeout(() => {
    if (opened) return;
    $('status').textContent = 'Приложение Lazy Music не установлено, открываю YouTube…';
    location.replace(yt);
  }, known ? 6000 : 2500);

  location.href = android ? intent : app;
})();
</script>
</body>
</html>
